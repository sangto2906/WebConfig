<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DopeT MIDI CC Config</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #1a1a2e;
    color: #eee;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }
  h1 {
    font-size: 1.8rem;
    margin-bottom: 0.5rem;
    background: linear-gradient(135deg, #667eea, #764ba2);
    background-clip: text;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .subtitle { color: #888; margin-bottom: 2rem; font-size: 0.9rem; }
  .card {
    background: #16213e;
    border-radius: 12px;
    padding: 2rem;
    width: 100%;
    max-width: 480px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  .connect-btn, .save-btn {
    width: 100%;
    padding: 0.8rem;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .connect-btn {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
    margin-bottom: 1.5rem;
  }
  .connect-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(102,126,234,0.4); }
  .connect-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .save-btn {
    background: linear-gradient(135deg, #11998e, #38ef7d);
    color: #1a1a2e;
    margin-top: 1.5rem;
  }
  .save-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(56,239,125,0.3); }
  .save-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .btn-row { display: flex; gap: 0.8rem; margin-top: 1.5rem; }
  .btn-row .save-btn, .btn-row .refresh-btn { margin-top: 0; }
  .refresh-btn {
    width: 100%;
    padding: 0.8rem;
    border: 2px solid #667eea;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    background: transparent;
    color: #667eea;
  }
  .refresh-btn:hover { background: rgba(102,126,234,0.1); }
  .refresh-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .slider-group {
    margin-bottom: 1.2rem;
    padding: 1rem;
    background: #0f3460;
    border-radius: 8px;
  }
  .slider-group label {
    display: block;
    font-size: 0.85rem;
    color: #aaa;
    margin-bottom: 0.5rem;
  }
  .slider-group .row {
    display: flex;
    align-items: center;
    gap: 0.8rem;
  }
  .slider-group select, .slider-group input {
    flex: 1;
    padding: 0.5rem 0.7rem;
    border-radius: 6px;
    border: 1px solid #333;
    background: #1a1a2e;
    color: #eee;
    font-size: 0.95rem;
  }
  .slider-group input[type="number"] {
    width: 70px;
    flex: none;
    text-align: center;
  }
  .daw-group {
    background: #1a1a2e;
    border: 1px solid #667eea;
  }
  .daw-select {
    flex: 2;
    padding: 0.5rem 0.7rem;
    border-radius: 6px;
    border: 1px solid #333;
    background: #0f3460;
    color: #eee;
    font-size: 0.95rem;
  }
  .note-info {
    flex: 1;
    font-size: 0.8rem;
    color: #888;
    text-align: right;
    white-space: nowrap;
  }
  .port-select {
    width: 100%;
    padding: 0.5rem 0.7rem;
    border-radius: 6px;
    border: 1px solid #333;
    background: #1a1a2e;
    color: #eee;
    font-size: 0.95rem;
    margin-bottom: 1rem;
  }
  .status {
    text-align: center;
    padding: 0.5rem;
    font-size: 0.8rem;
    color: #888;
    margin-top: 1rem;
  }
  .status.ok { color: #38ef7d; }
  .status.err { color: #ff6b6b; }
  .hidden { display: none; }
</style>
</head>
<body>

<h1>DopeT MIDI CC Config</h1>
<p class="subtitle">Web MIDI SysEx — Chrome / Edge required</p>

<div class="card">
  <select class="port-select" id="portSelect">
    <option value="">-- Select Port for Config --</option>
  </select>
  <button class="connect-btn" id="btnConnect">Connect</button>

  <div id="controls" class="hidden">
    <div class="slider-group">
      <label>Slider 1 (GP27)</label>
      <div class="row">
        <select id="cc0"></select>
        <input type="number" id="ccNum0" min="0" max="127" value="11">
      </div>
    </div>
    <div class="slider-group">
      <label>Slider 2 (GP28)</label>
      <div class="row">
        <select id="cc1"></select>
        <input type="number" id="ccNum1" min="0" max="127" value="1">
      </div>
    </div>
    <div class="slider-group">
      <label>Slider 3 (GP26)</label>
      <div class="row">
        <select id="cc2"></select>
        <input type="number" id="ccNum2" min="0" max="127" value="12">
      </div>
    </div>
    <div class="slider-group daw-group">
      <label>DAW Profile for Undo Button</label>
      <div class="row">
        <select id="dawProfile" class="daw-select"></select>
        <span id="dawNoteInfo" class="note-info">--</span>
      </div>
    </div>
    <div class="btn-row">
      <button class="refresh-btn" id="btnRefresh">Refresh</button>
      <button class="save-btn" id="btnSave">Save to Device</button>
    </div>
  </div>

  <div class="status" id="status"></div>
</div>

<script>
const CC_NAMES = {
  0: "Bank Select", 1: "Mod Wheel", 2: "Breath", 4: "Foot Controller",
  5: "Portamento Time", 7: "Volume", 8: "Balance", 10: "Pan",
  11: "Expression", 12: "Effect 1", 13: "Effect 2",
  64: "Sustain", 65: "Portamento", 66: "Sostenuto", 67: "Soft Pedal",
  68: "Legato", 69: "Hold 2", 70: "Sound Variation", 71: "Resonance",
  72: "Release", 73: "Attack", 74: "Cutoff", 75: "Decay",
  76: "Vibrato Rate", 77: "Vibrato Depth", 78: "Vibrato Delay",
  91: "Reverb", 92: "Tremolo", 93: "Chorus", 94: "Detune", 95: "Phaser"
};

const SYSEX_MFR = 0x7D;
const CMD_GET       = 0x01;
const CMD_SET       = 0x02;
const CMD_SAVE      = 0x03;
const CMD_GET_UNDO  = 0x10;
const CMD_SET_UNDO  = 0x11;

const DAW_PROFILES = [
  { name: "Cubase / Logic", note: 0x46, desc: "Note 70 (Mackie MCU standard)" },
  { name: "FL Studio", note: 0x3D, desc: "Note 61 (custom mapping)" },
  { name: "Studio One", note: 0x51, desc: "Note 81 (custom mapping)" }
];

let midiAccess = null;
let midiOut = null;   // send SysEx to DopeT (cable 0)
let midiIn = null;    // receive replies from DopeT (cable 0)
let sysexResolve = null;
let sysexTimeout = null;
let connected = false;

function buildSelects() {
  // Build CC dropdowns for sliders
  for (let s = 0; s < 3; s++) {
    const sel = document.getElementById(`cc${s}`);
    for (let i = 0; i <= 127; i++) {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = CC_NAMES[i] ? `${i} - ${CC_NAMES[i]}` : `CC ${i}`;
      sel.appendChild(opt);
    }
    sel.addEventListener('change', () => {
      document.getElementById(`ccNum${s}`).value = sel.value;
    });
    document.getElementById(`ccNum${s}`).addEventListener('change', (e) => {
      const v = Math.max(0, Math.min(127, parseInt(e.target.value) || 0));
      e.target.value = v;
      sel.value = v;
    });
  }

  // Build DAW profile dropdown
  const dawSel = document.getElementById('dawProfile');
  for (let i = 0; i < DAW_PROFILES.length; i++) {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = DAW_PROFILES[i].name;
    dawSel.appendChild(opt);
  }
  dawSel.addEventListener('change', updateDawNoteInfo);
}

function updateDawNoteInfo() {
  const idx = parseInt(document.getElementById('dawProfile').value) || 0;
  const profile = DAW_PROFILES[idx];
  if (profile) {
    document.getElementById('dawNoteInfo').textContent = `0x${profile.note.toString(16).toUpperCase().padStart(2,'0')} (${profile.desc.split(' ')[1]})`;
  }
}

function setStatus(msg, type = '') {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status ' + type;
}

function sendSysEx(data) {
  if (!midiOut) return;
  const msg = [0xF0, SYSEX_MFR, ...data, 0xF7];
  midiOut.send(msg);
}

function waitSysExReply(cmd, timeoutMs = 3000) {
  return new Promise((resolve) => {
    if (sysexTimeout) clearTimeout(sysexTimeout);
    sysexResolve = (data) => {
      if (data[0] === SYSEX_MFR && data[1] === cmd) {
        clearTimeout(sysexTimeout);
        sysexResolve = null;
        resolve(data);
      }
    };
    sysexTimeout = setTimeout(() => {
      sysexResolve = null;
      resolve(null);
    }, timeoutMs);
  });
}

function onMidiMessage(e) {
  const d = e.data;
  if (!d || d.length < 4) return;
  // SysEx: starts with F0, ends with F7
  if (d[0] === 0xF0 && d[d.length - 1] === 0xF7) {
    const payload = Array.from(d.slice(1, d.length - 1));
    if (sysexResolve) sysexResolve(payload);
  }
}

async function populatePorts() {
  const sel = document.getElementById('portSelect');
  sel.innerHTML = '<option value="">-- Select DopeT for Config --</option>';

  if (!midiAccess) {
    try {
      midiAccess = await navigator.requestMIDIAccess({ sysex: true });
    } catch (e) {
      setStatus('MIDI access denied. Enable SysEx permission.', 'err');
      return;
    }
  }

  // List outputs - DopeT for config/Mackie, DopeT for CC
  const outputs = Array.from(midiAccess.outputs.values());
  const inputs = Array.from(midiAccess.inputs.values());

  for (const out of outputs) {
    const opt = document.createElement('option');
    opt.value = out.id;
    opt.textContent = out.name;
    // auto-select if name is "DopeT" (cable 0: config/Mackie)
    if (out.name && out.name === 'DopeT') {
      opt.selected = true;
    }
    sel.appendChild(opt);
  }

  // Store inputs for matching later
  sel.dataset.inputs = JSON.stringify(inputs.map(i => ({ id: i.id, name: i.name })));
}

function findMatchingInput(outputName) {
  if (!midiAccess) return null;
  const inputs = Array.from(midiAccess.inputs.values());
  // Find "DopeT" input to receive replies
  for (const inp of inputs) {
    if (inp.name && inp.name === 'DopeT') return inp;
  }
  // fallback: first input
  return inputs[0] || null;
}

async function loadConfigFromDevice() {
  setStatus('Reading config...', 'ok');
  
  // Load CC config
  sendSysEx([CMD_GET]);
  const ccResp = await waitSysExReply(CMD_GET, 3000);
  if (ccResp && ccResp.length >= 5) {
    for (let i = 0; i < 3; i++) {
      const val = Math.max(0, Math.min(127, ccResp[i + 2]));
      document.getElementById(`cc${i}`).value = val;
      document.getElementById(`ccNum${i}`).value = val;
    }
  } else {
    setStatus('No response for CC config.', 'err');
    return false;
  }

  // Load DAW undo profile
  sendSysEx([CMD_GET_UNDO]);
  const undoResp = await waitSysExReply(CMD_GET_UNDO, 3000);
  if (undoResp && undoResp.length >= 3) {
    const currentProfile = undoResp[2];
    document.getElementById('dawProfile').value = currentProfile;
    updateDawNoteInfo();
    setStatus('Config loaded (CC + DAW profile).', 'ok');
    return true;
  }
  setStatus('Config partially loaded (no DAW profile response).', 'ok');
  return true;
}

document.getElementById('btnConnect').addEventListener('click', async () => {
  if (connected) {
    // disconnect
    if (midiIn) { midiIn.onmidimessage = null; midiIn = null; }
    midiOut = null;
    connected = false;
    document.getElementById('btnConnect').textContent = 'Connect';
    document.getElementById('controls').classList.add('hidden');
    setStatus('Disconnected.', '');
    return;
  }

  const sel = document.getElementById('portSelect');
  const outId = sel.value;
  if (!outId) { setStatus('Select a MIDI port first.', 'err'); return; }

  const out = midiAccess.outputs.get(outId);
  if (!out) { setStatus('MIDI port not found.', 'err'); return; }

  midiOut = out;

  // Find matching input to receive replies
  midiIn = findMatchingInput(out.name);
  if (midiIn) {
    midiIn.onmidimessage = onMidiMessage;
  } else {
    setStatus('Warning: no DopeT input found. Select manually.', 'err');
  }

  connected = true;
  document.getElementById('btnConnect').textContent = 'Disconnect';
  document.getElementById('controls').classList.remove('hidden');

  await loadConfigFromDevice();
});

document.getElementById('btnRefresh').addEventListener('click', async () => {
  if (!connected) { setStatus('Not connected.', 'err'); return; }
  await loadConfigFromDevice();
});

document.getElementById('btnSave').addEventListener('click', async () => {
  if (!connected) { setStatus('Not connected.', 'err'); return; }
  
  // Save CC config
  for (let i = 0; i < 3; i++) {
    const cc = parseInt(document.getElementById(`ccNum${i}`).value) || 0;
    sendSysEx([CMD_SET, i, cc]);
    const resp = await waitSysExReply(CMD_SET, 3000);
    if (!resp || resp[2] !== 0x00) {
      setStatus(`Error setting slider ${i + 1}: ${resp ? 'rejected' : 'no response'}`, 'err');
      return;
    }
    await new Promise(r => setTimeout(r, 50));
  }
  
  // Save DAW undo profile
  const dawProfile = parseInt(document.getElementById('dawProfile').value) || 0;
  sendSysEx([CMD_SET_UNDO, dawProfile]);
  const dawResp = await waitSysExReply(CMD_SET_UNDO, 3000);
  if (!dawResp || dawResp[2] !== 0x00) {
    setStatus('Error setting DAW profile: ' + (dawResp ? 'rejected' : 'no response'), 'err');
    return;
  }
  await new Promise(r => setTimeout(r, 50));
  
  // Commit to flash
  sendSysEx([CMD_SAVE]);
  const resp = await waitSysExReply(CMD_SAVE, 3000);
  if (resp && resp[2] === 0x00) {
    setStatus('Saved to device flash! ✓', 'ok');
  } else {
    setStatus('Save failed: ' + (resp ? 'rejected' : 'no response'), 'err');
  }
});

buildSelects();

// Initialize MIDI access and populate ports
if (navigator.requestMIDIAccess) {
  navigator.requestMIDIAccess({ sysex: true }).then(access => {
    midiAccess = access;
    access.onstatechange = () => populatePorts();
    populatePorts();
  }).catch(() => {
    setStatus('Web MIDI not supported or SysEx denied.', 'err');
  });
} else {
  setStatus('Web MIDI API not available in this browser.', 'err');
}
</script>
</body>
</html>
